# 장면 부품 목록 (REQ-040, 결정 0043-4). 팔 밖의 물체를 적으면 GUI가 3D로 그리고, collide: true인 작업대 부품은 팔과의 충돌 거리를 검사한다.
# 배출 통(workspace.yaml drop_zones의 type: bin)의 벽은 여기 적지 않는다: load_scene(ws=...)가 통 값으로 만든다(bin_<구역>_s·n·w·e, 결정 0067).
margin_mm: 10            # 이보다 가까워지면 거부(scene:<이름>)
parts:
  # 초음파 레이더 받침(결정 0067 CAD: 모터 브라켓·XL330·센서 브라켓·OpenRB+HC-SR04, 바디마다 볼록 껍질). 원점 = 서보 축·작업대 면, 센서는 정면(90°, 팔 쪽 -y) 자세.
  # shortcut: 센서는 XL330으로 10~170° 돌지만 충돌 형상은 정면 자세 하나다. 돌면 센서 브라켓(축에서 약 49mm)이 축 둘레 반경 약 50mm 반원(판 쪽 y < 405.5)을 쓸고 지나간다. 팔이 그 안에 들어갈 일이 생기면 쓸린 부피로 바꾼다
  - name: radar_station
    file: assets/scene/radar_station.stl   # 서보 축 기준 mm. 출처 assets/scene/NOTICE.txt
    attach: table            # table 또는 URDF 링크 이름
    xyz_mm: [207.3, 405.5, 0]  # 결정 0067 레이더 서보 축(판 밖 앞 프로파일 위). table이면 작업대 좌표(z = 작업대 면 위), 링크면 그 링크 프레임 기준 mm
    rpy_deg: [0, 0, 0]
    collide: true
    color: "#8a8f98"

  # 손목 초음파 브래킷(H4, 병렬 그리퍼 전용: gripper_link가 병렬 URDF의 것). `gripper:`가 cfg 그리퍼와 다르면 모든 쪽(3D·충돌·MuJoCo)이 건너뛴다(키가 없으면 늘 쓴다). 출처 assets/scene/NOTICE.txt, 평가 arm/parts_eval.py
  - {name: wrist_hcsr04, file: assets/scene/wrist_hcsr04.stl, attach: gripper_link, collide: true, color: "#2f6fdb", gripper: parallel}
  - {name: wrist_bracket, file: assets/scene/wrist_bracket.stl, attach: gripper_link, collide: true, color: "#e08a1e", gripper: parallel}
