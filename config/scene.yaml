# 장면 부품 목록 (REQ-040, 결정 0043-4). 팔 밖의 물체를 적으면 GUI가 3D로 그리고, collide: true인 작업대 부품은 팔과의 충돌 거리를 검사한다.
margin_mm: 10            # 이보다 가까워지면 거부(scene:<이름>)
parts:
  # 예시: 초음파 레이더 스테이션. 자리는 config/ultrasonic.yaml의 radar.station_mm. 크기는 실물을 재서 바꾼다.
  - name: radar_station
    box_mm: [60, 40, 20]     # [w, d, h], 가운데 아래면이 원점. STL이면 file: assets/scene/<이름>.stl (mm 단위)
    attach: table            # table 또는 URDF 링크 이름
    xyz_mm: [300, 400, 0]    # table이면 작업대 좌표(z = 작업대 면 위), 링크면 그 링크 프레임 기준 mm
    rpy_deg: [0, 0, 0]
    collide: true
    color: "#8a8f98"

  # 손목 초음파 브래킷(H4, 병렬 그리퍼 전용: gripper_link가 병렬 URDF의 것). `gripper:`가 cfg 그리퍼와 다르면 모든 쪽(3D·충돌·MuJoCo)이 건너뛴다(키가 없으면 늘 쓴다). 출처 assets/scene/NOTICE.txt, 평가 arm/parts_eval.py
  - {name: wrist_hcsr04, file: assets/scene/wrist_hcsr04.stl, attach: gripper_link, collide: true, color: "#2f6fdb", gripper: parallel}
  - {name: wrist_bracket, file: assets/scene/wrist_bracket.stl, attach: gripper_link, collide: true, color: "#e08a1e", gripper: parallel}
