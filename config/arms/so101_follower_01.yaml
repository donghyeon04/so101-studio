# 이 팔(SO-101 팔로워 01)에서 잰 값 (decisions/0027). robot.yaml의 공통 값 위에 겹쳐 읽는다.
# 다른 팔에는 쓰지 않는다: 새 팔은 _template.yaml을 복사해 캘리브레이션 뒤에 채운다.
board_serial: "5B8E114816"   # USB 시리얼 보드(CH343 1A86:55D3)의 시리얼 번호. so101 doctor가 연결된 보드와 이 값으로 팔을 고른다
measured_on: "2026-11-01"     # 캘리브레이션을 한 날 (measurements.md T0)
calibration_id: so101_follower_01
calibration_id_by_gripper:  # 그리퍼별 캘리브레이션(arm-software-spec 7.1, REQ-107). 서보 6 범위·영점이 그리퍼마다 다르다. 병렬 파일은 단동식 파일 복사본이고 서보 6은 로보나인 교체 뒤 runbook 2-10으로 다시 잰다(그 전까지 0° 확인 기록이 없어 실물은 locked)
  single_jaw: so101_follower_01
  parallel: so101_follower_01_parallel
joint_offsets_deg:         # 영점 보정(도). 읽은 값 = 모터 값 - offset. pan: 정면에서 오른쪽으로 약 1.5° 틀어져 있어 왼쪽으로 맞춤 (2026-11-01 사용자 육안, 1.5°, 그 뒤 0.5°씩 세 번 더)
  shoulder_pan: -3.0
joint_limits_deg:          # physical_limits_deg(새 캘리브레이션 실제 범위)에서 안쪽으로 1° 줄인 값 (REQ-054, 사용자 결정 2026-11-11). 손목 한계로 먼 곳에서 대칭 V자 놓기가 안 되던 것을 넓힘
  shoulder_pan: [-120.3, 120.3]
  shoulder_lift: [-104.7, 104.7]
  elbow_flex: [-97.7, 95]   # 접을 때 J2 모터에 닿는 것을 피하려고 위쪽 한계는 95 그대로(96이 닿기 직전, 서보가 명령보다 0.4° 더 감). 받침에 기댄 자세 약 97.4°는 시작점이라 검사하지 않는다
  wrist_flex: [-103.6, 103.6]
  wrist_roll: [-168.8, 168.8]
  gripper: [1, 99]
physical_limits_deg:       # 새 캘리브레이션(2026-11-10 AC4, 3회 중앙값)이 제안한 실제 가동 범위 (measurements.md "AC4 자동 캘리브레이션과 0° 확인 (2026-11-10 밤)"). joint_limits_deg를 넓혀도 이 범위 안에서만
  shoulder_pan: [-121.3, 121.3]
  shoulder_lift: [-105.7, 105.7]
  elbow_flex: [-98.7, 98.7]
  wrist_flex: [-104.6, 104.6]
  wrist_roll: [-169.8, 169.8]
  gripper: [0.8, 99.6]   # 단위가 값(0~100)이라 그대로
table_z_mm: -2.9           # 작업대 면의 모델 z(mm). 결정 0067(H-2): 새 받침 CAD에서 혼 윗면 y 64.25 <-> URDF shoulder_pan 원점 z 62.4라 판 윗면(CAD y -1)은 모델 z -2.85(±0.5). H-6 실물 조립 뒤 접촉 4곳 실측으로 고친다.
                           # (아래는 옛 받침 값 -15의 근거) 2026-11-07 실물 재실측(measurements.md "실물 점검과 높이 다시 실측", REQ-046): GUI와 같은 point_pose(턱 끝, 면 위 40mm, pitch -90)로
                           # (300,150)·(300,230)·(300,290)에 보냈을 때 ToolPose 모델 z 12.3, 실측(그리퍼 가장 낮은 끝~바닥) 19~20, 약 20, 16~17mm. 턱 끝의 모델 z = 12.3 - 7.3(기준점이 끝보다 위) = 5.0이고
                           # 면까지 약 20mm이므로 면의 모델 z는 5.0 - 20 = 약 -15. 먼 점(반경 240)은 처짐으로 3mm 더 낮게 나온다.
                           # 11-06의 -25 -> -35는 잘못이었다: 그날 CLI `goto x y 40 90`의 40은 턱 끝 높이가 아니라 ToolPose 모델 z였는데 턱 끝 높이로 읽었다(두 날의 모델 z 차 27.7mm와 실측 차 28~32mm가 거의 같다).
                           # 접촉 4곳 실측(REQ-019 3)으로 다시 확인한다.
gripper_width_mm:          # [그리퍼 값, 턱 끝 벌림 mm]. URDF 메쉬 기하(관절 -10°~100°)에 카드 시험 2점(54mm가 값 32.0과 27.7에서 접촉)을 맞춰 값 0~100을 -10°~111°에 선형 대응시킨 계산값. 큰/작은 폭은 실측 전
  - [0, 2.7]
  - [8.2, 16.8]
  - [24.7, 45.5]
  - [41.2, 72.2]
  - [57.7, 93.5]
  - [74.1, 106.9]
  - [90.6, 110.8]
  - [100, 111.0]
grasp_bias_mm: 0           # 턱 중심 보정의 미세 조정(가동 턱 쪽이 +, mm). URDF 기하로 계산한 위치가 실제와 다르면 작은 물체로 시험해서 정한다
calibration_checked:         # so101 calibrate --verify-zero가 기록 (decisions/0029). 캘리브레이션 파일이 바뀌면 다시 확인해야 움직인다
  date: "2026-11-14"
  sha256: "2b536bdbe9d11e78e4bb9ae4b605250ec158b82c9fd2718646d78f3349048dd7"
