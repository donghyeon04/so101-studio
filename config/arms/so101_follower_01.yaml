# 이 팔(SO-101 팔로워 01)에서 잰 값 (decisions/0027). robot.yaml의 공통 값 위에 겹쳐 읽는다.
# 다른 팔에는 쓰지 않는다: 새 팔은 _template.yaml을 복사해 캘리브레이션 뒤에 채운다.
board_serial: "5B8E114816"   # USB 시리얼 보드(CH343 1A86:55D3)의 시리얼 번호. so101 doctor가 연결된 보드와 이 값으로 팔을 고른다
measured_on: "2026-11-01"     # 캘리브레이션을 한 날 (measurements.md T0)
calibration_id: so101_follower_01
joint_offsets_deg:         # 영점 보정(도). 읽은 값 = 모터 값 - offset. pan: 정면에서 오른쪽으로 약 1.5° 틀어져 있어 왼쪽으로 맞춤 (2026-11-01 사용자 육안, 1.5°, 그 뒤 0.5°씩 세 번 더)
  shoulder_pan: -3.0
joint_limits_deg:          # 캘리브레이션으로 잰 가동 범위(measurements.md)에서 안쪽으로 1~3° 줄인 값. T5에서 safety.py로 옮긴다
  shoulder_pan: [-118, 118]
  shoulder_lift: [-103, 103]
  elbow_flex: [-96, 95]   # 접을 때 J2 모터에 닿는 것을 피하려고 위쪽 한계를 98에서 95로 줄였다(96이 닿기 직전, 서보가 명령보다 0.4° 더 감). 받침에 기댄 자세 약 97.4°는 시작점이라 검사하지 않는다
  wrist_flex: [-101, 101]
  wrist_roll: [-170, 170]
  gripper: [1, 99]
physical_limits_deg:       # 캘리브레이션 때 손으로 읽은 실제 가동 범위(measurements.md T0-5). joint_limits_deg를 넓혀도 이 범위 안에서만
  shoulder_pan: [-119.5, 119.5]
  shoulder_lift: [-104.3, 104.4]
  elbow_flex: [-97.2, 97.1]
  wrist_flex: [-101.8, 102.6]
  wrist_roll: [-164.2, 169.7]
  gripper: [0.8, 99.6]
table_z_mm: -25            # 작업대 면의 모델 z(mm) 추정. 사용자가 육안으로 턱 끝과 작업대 사이를 본 값(모델 z 2mm에서 손가락 한 마디, 4mm 내린 뒤에도 한 마디)으로 조금씩 내려 추정, 실측 전
gripper_width_mm:          # [그리퍼 값, 턱 끝 벌림 mm]. URDF 메쉬 기하(관절 -10°~100°)에 카드 시험 2점(54mm가 값 32.0과 27.7에서 접촉)을 맞춰 값 0~100을 -10°~111°에 선형 대응시킨 계산값. 큰/작은 폭은 실측 전
  - [0, 2.7]
  - [8.2, 16.8]
  - [24.7, 45.5]
  - [41.2, 72.2]
  - [57.7, 93.5]
  - [74.1, 106.9]
  - [90.6, 110.8]
  - [100, 111.0]
grasp_bias_mm: 0           # 턱 중심 보정의 미세 조정(가동 턱 쪽이 +, mm). URDF 기하로 계산한 위치가 실제와 다르면 작은 물체로 시험해서 정한다
