# 새 팔용 템플릿. config/arms/<팔 이름>.yaml로 복사해 채운다 (decisions/0027).
# 순서: lerobot-setup-motors -> lerobot-calibrate(--robot.id=<calibration_id>) -> so101 doctor로 확인 -> 아래 값 채우기.
# 이 파일은 팔 목록에 들어가지 않는다(이름이 _로 시작). 값이 비어 있는 동안에는 이 팔을 움직이지 않는다.
board_serial: ""           # so101 doctor가 보여 주는 USB 시리얼 보드의 시리얼 번호
measured_on: ""            # 캘리브레이션 한 날 (YYYY-MM-DD)
calibration_id: ""         # lerobot-calibrate의 --robot.id
# calibration_id_by_gripper: {single_jaw: <id>, parallel: <id>_parallel}   # 그리퍼별 캘리브레이션 파일을 쓸 때(arm-software-spec 7.1). 없으면 calibration_id 하나
joint_offsets_deg: {}      # 영점 보정(도). 모르면 비워 둔다
joint_limits_deg:          # 캘리브레이션으로 잰 가동 범위에서 안쪽으로 1~3° 줄인 값(도). 실제 팔에서 재야 한다
  shoulder_pan: [-100, 100]
  shoulder_lift: [-90, 90]
  elbow_flex: [-90, 90]
  wrist_flex: [-90, 90]
  wrist_roll: [-150, 150]
  gripper: [5, 95]
physical_limits_deg: {}    # 손으로 읽은 실제 가동 범위(도). 모르면 비워 둔다
table_z_mm: 0              # 작업대 면의 모델 z(mm). 실측 필요
gripper_width_mm:          # [그리퍼 값, 턱 끝 벌림 mm]. 새 그리퍼면 다시 잰다
  - [0, 0]
  - [100, 90]
grasp_bias_mm: 0
