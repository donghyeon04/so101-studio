# config/local.yaml로 복사해 쓴다. 이 PC에서만 필요한 값이라 git에 올리지 않는다(.gitignore). 없으면 robot.yaml과 팔 파일만 쓴다.
# robot.yaml과 팔 파일의 같은 키를 덮어쓴다(키 단위로 통째로 바꾼다).
# arm: so101_follower_01     # 팔 파일 이름(config/arms/<이름>.yaml). 보드 시리얼로 자동으로 고르면 필요 없다
# port: COM3                 # 시리얼 포트. 자동 찾기(so101 doctor, so101 find-port)가 안 맞을 때만
