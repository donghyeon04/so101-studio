# 초음파 인식 설정 (docs/planning/ultrasonic-spec.md 8.3절). 확인 모드는 하나다(결정 0038). T8은 check.approach_line 옵션, T9(early_stop_cells)는 끈다.
port: auto                # local.yaml이 우선
baud: 921600
ping_gap_ms: 33
servo: {driver: pwm}      # pwm = MG90S(GPIO 13) | dxl = OpenRB-150 + XL330(결정 0043, 읽은 각도 ang). 연결할 때 펌웨어에 `driver` 명령으로 알린다
beam_half_deg: 7.5        # B1 실측으로 고침
radar:
  station_mm: {x: 300, y: 400}
  heading_deg: -90
  height_mm: 20
  sweep: {from_deg: 10, to_deg: 170, step_deg: 4, bounce: true}
  max_mm: 600
  dip_mm: 30
  min_arc: 2
  split_mm: 25
  merge_mm: 110
  range_offset_mm: 15
  prefetch_sweeps: 4
  empty_extra_sweeps: 3   # 첫 1~2바퀴에 후보가 없으면 이만큼 더 돌려 합쳐 다시 판단
  rescan_home: true       # 후보가 없으면 레이더 시야를 가리지 않는 대기 자세로 옮겨 prefetch_sweeps바퀴 다시 본다(RESCAN, 연달아 두 번은 안 함)
  early_start: true
  arm_mask_deg: 5
  arm_mask_mm: 60
check:
  max_object_height_mm: 40
  clearance_mm: 15
  speed_mm_s: 100         # tool_v_max_mm_s와 같게 (4절)
  yaw_deg: 90             # 확인 경로 동안 고정할 손목 각도(평소 자세, 6절 "손목 회전은 지금 그대로"). 센서 오프셋은 도구 프레임 값이라 이 각도로 돌려 작업대 좌표로 바꾼다
  sample_mm: 6
  line_mm: 180
  ring_r_mm: 60
  ring_n: 36
  hit_mm: 15
  approach_line: false    # T8 옵션 (결정 0038): true면 첫 확인선을 팔 원점에서 후보로 가는 방향으로
  early_stop_cells: 0     # T9, 경로 안에서 멈추는 기능이 생길 때까지 0(끔)
  fallback_grid_mm: 20
  max_fail_per_run: 3     # 한 번의 작업 실행에서 확인·집기 실패가 이만큼이면 DONE. 0 = 끔
  tool_reach_mm: {min: 60, max: 255}   # 손끝 반경, 팔 원점 기준 (REQ-023 계산 50~265 + 여유)
arm_sensor_offset_mm: {x: 0.6, y: 66.5, z: 99.5}   # 두 턱 끝 가운데 기준, 결정 0063, #335 (CAD 값, 센서 높이 약 155mm). 도구 프레임(x = 턱이 벌어지는 축), A0 보정으로 고침
