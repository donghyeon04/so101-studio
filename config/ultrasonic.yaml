# 초음파 인식 설정 (docs/planning/ultrasonic-spec.md 8.3절). mode: fast면 check.approach_line=true, early_stop_cells=3, line_mm=130으로 덮어쓴다(4절 T8·T9, line_mm은 U9 조정값).
mode: accurate            # accurate | fast
port: auto                # local.yaml이 우선
baud: 921600
ping_gap_ms: 33
beam_half_deg: 7.5        # B1 실측으로 고침
radar:
  station_mm: {x: 300, y: 400}
  heading_deg: -90
  height_mm: 20
  sweep: {from_deg: 10, to_deg: 170, step_deg: 4, bounce: true}
  max_mm: 600
  dip_mm: 30
  min_arc: 2
  split_mm: 25
  merge_mm: 110
  range_offset_mm: 15
  prefetch_sweeps: 4
  early_start: true
  arm_mask_deg: 5
  arm_mask_mm: 60
check:
  max_object_height_mm: 40
  clearance_mm: 15
  speed_mm_s: 100         # tool_v_max_mm_s와 같게 (4절)
  yaw_deg: 0              # 확인 경로 동안 고정할 손목 각도. arm_sensor_offset_mm는 이 각도일 때의 값
  sample_mm: 6
  line_mm: 180
  ring_r_mm: 45
  ring_n: 36
  hit_mm: 15
  approach_line: false    # fast 모드에서 true (T8)
  early_stop_cells: 0     # fast 모드에서 3 (T9)
  fallback_grid_mm: 20
arm_sensor_offset_mm: {x: 0, y: 30, z: 55}   # 손끝 기준, A0 보정으로 고침
