# 초음파 인식 설정 (docs/planning/ultrasonic-spec.md 8.3절). mode: fast면 check.approach_line=true로 덮어쓴다(4절 T8). T9(early_stop_cells)는 두 모드 모두 끈다.
mode: accurate            # accurate | fast
port: auto                # local.yaml이 우선
baud: 921600
ping_gap_ms: 33
beam_half_deg: 7.5        # B1 실측으로 고침
radar:
  station_mm: {x: 300, y: 400}
  heading_deg: -90
  height_mm: 20
  sweep: {from_deg: 10, to_deg: 170, step_deg: 4, bounce: true}
  max_mm: 600
  dip_mm: 30
  min_arc: 2
  split_mm: 25
  merge_mm: 110
  range_offset_mm: 15
  prefetch_sweeps: 4
  empty_extra_sweeps: 3   # 첫 1~2바퀴에 후보가 없으면 이만큼 더 돌려 합쳐 다시 판단
  rescan_home: true       # 후보가 없으면 레이더 시야를 가리지 않는 대기 자세로 옮겨 prefetch_sweeps바퀴 다시 본다(RESCAN, 연달아 두 번은 안 함)
  early_start: true
  arm_mask_deg: 5
  arm_mask_mm: 60
check:
  max_object_height_mm: 40
  clearance_mm: 15
  speed_mm_s: 100         # tool_v_max_mm_s와 같게 (4절)
  yaw_deg: 90             # 확인 경로 동안 고정할 손목 각도(평소 자세, 6절 "손목 회전은 지금 그대로"). 센서 오프셋은 도구 프레임 값이라 이 각도로 돌려 작업대 좌표로 바꾼다
  sample_mm: 6
  line_mm: 180
  ring_r_mm: 45
  ring_n: 36
  hit_mm: 15
  approach_line: false    # fast 모드에서 true (T8)
  early_stop_cells: 0     # T9, 지금은 두 모드 모두 0
  fallback_grid_mm: 20
  max_fail_per_run: 0     # 한 번의 작업 실행에서 확인 실패(물체 없음·못 감)가 이만큼이면 끝낸다. 0 = 끔
  tool_reach_mm: {min: 60, max: 255}   # 손끝 반경, 팔 원점 기준 (REQ-023 계산 50~265 + 여유)
arm_sensor_offset_mm: {x: 0, y: 30, z: 55}   # 손끝 기준 도구 프레임(x = 턱이 벌어지는 축), A0 보정으로 고침
