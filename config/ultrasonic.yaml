# 초음파 인식 설정 (docs/planning/ultrasonic-spec.md 8.3절). 확인 모드는 하나다(결정 0038). T8은 check.approach_line 옵션, T9(early_stop_cells)는 끈다.
port: auto                # local.yaml이 우선
baud: 921600
ping_gap_ms: 33
servo: {driver: pwm}      # pwm = MG90S(GPIO 13) | dxl = OpenRB-150 + XL330(결정 0043, 읽은 각도 ang). 연결할 때 펌웨어에 `driver` 명령으로 알린다
beam_half_deg: 7.5        # B1 실측으로 고침
radar:
  station_mm: {x: 207.3, y: 405.5}   # 결정 0067 CAD(서보 축). H-6 실측으로 고침
  heading_deg: -90
  height_mm: 23.2          # 결정 0067 CAD
  face_offset_mm: 48.7     # 결정 0067: 서보 축 → 송수신기 앞면. 거리는 앞면에서 재므로 위치 계산에 더한다
  sweep: {from_deg: 10, to_deg: 170, step_deg: 4, bounce: true}
  max_mm: 600
  dip_mm: 30
  min_arc: 2
  split_mm: 25
  merge_mm: 110
  range_offset_mm: 15
  prefetch_sweeps: 4
  empty_extra_sweeps: 3   # 첫 1~2바퀴에 후보가 없으면 이만큼 더 돌려 합쳐 다시 판단
  rescan_home: true       # 후보가 없으면 레이더 시야를 가리지 않는 대기 자세로 옮겨 prefetch_sweeps바퀴 다시 본다(RESCAN, 연달아 두 번은 안 함)
  early_start: true
  arm_mask_deg: 5
  arm_mask_mm: 60
check:
  max_object_height_mm: 40
  clearance_mm: 15
  speed_mm_s: 100         # tool_v_max_mm_s와 같게 (4절)
  yaw_pivot_mm: 150       # 결정 0065: 후보 반경별 CHECK yaw(check.pick_yaw). 이 반경에서 센서가 손끝과 같은 반경에 온다. 0이면 끔(yaw_deg 고정)
  yaw_deg: 90             # 확인 경로 동안 고정할 손목 각도(평소 자세, 6절 "손목 회전은 지금 그대로"). 센서 오프셋은 도구 프레임 값이라 이 각도로 돌려 작업대 좌표로 바꾼다
  sample_mm: 6
  line_mm: 180
  ring_r_mm: 60
  ring_n: 36
  ring_auto_mm: [35, 75]  # 결정 0075: 원 반지름 = (L1 + L2 구간 길이)/4를 이 범위로 자름(40x80이 60mm 원에 모서리만 걸려 방향이 쏠리는 것을 막는다). null이면 ring_r_mm 고정
  hit_mm: 15
  valley_split_mm: 0      # 8.10 N1 초안: 메아리 구간 안 h 골이 이만큼 깊으면 나눈다(이웃). 0 = 끔
  max_extent_mm: 0        # 8.10 N2 초안: 빔 폭을 뺀 구간이 이보다 길면 후보 쪽만 쓴다. 0 = 끔
  ring_mirror_cells: 0    # 8.10 N3 초안: 원 칸 중 반대편 ±이 칸 안에 짝이 있는 것만 방향에 쓴다. 0 = 끔
  approach_line: false    # T8 옵션 (결정 0038): true면 첫 확인선을 팔 원점에서 후보로 가는 방향으로
  early_stop_cells: 0     # T9, 경로 안에서 멈추는 기능이 생길 때까지 0(끔)
  fallback_grid_mm: 20
  max_fail_per_run: 3     # 한 번의 작업 실행에서 확인·집기 실패가 이만큼이면 DONE. 0 = 끔
  tool_reach_mm: {min: 100, max: 255}   # 단동식(기본). 손끝 반경, 팔 원점 기준. 방위 45·90·135° 모두 되는 범위(접근 높이 60 기준, REQ-090·measurements "H-2 뒤 집기 범위")
  retry_pull_mm: 2        # U16: ik_fail이면 그 단계 첫 점을 이만큼씩 안쪽으로 당겨 다시 부른다
  retry_pull_max_mm: 85   # 당기는 거리 합의 상한. 0 = 끔
  line_yaw_alt_deg: [-90, -45, 45, 90]  # 결정 0075: 후보 yaw에 더할 각도들. 도달 범위에 안 드는 선을 손목 각도 둘까지로 나눠 가고, ik_fail이면 다른 각도로 먼저 다시 낸다. []이면 후보 yaw 하나(0065)
  tool_reach_by_gripper:   # 그리퍼 종류별 도달 범위(결정 11-15 기획): 있으면 tool_reach_mm 대신 쓴다. 병렬 손은 H-2 뒤 접근 높이 60 기준 95~230(REQ-090). 범위 밖 점이 경로에 남으면 단계 전체가 ik_fail
    parallel: {min: 95, max: 230}
arm_sensor_offset_mm: {x: 0.6, y: 66.5, z: 99.5}   # 두 턱 끝 가운데 기준, 결정 0063, #335 (CAD 값, 센서 높이 약 155mm). 도구 프레임(x = 턱이 벌어지는 축), A0 보정으로 고침
