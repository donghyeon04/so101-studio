# 병렬 그리퍼(Robonine Parallel Gripper, STS3215 ID 6, 스트로크 84mm). 결정 0043-1. 켜려면 config/local.yaml에 `gripper: parallel`.
# TCP는 두 턱 중앙, 보정 0, 기본 수직(grasp_tilt_deg 0), `grasp_approach: auto`면 접근 각도 후보 고르기(arm-software-spec 6.6.1), W <= G - 4. 아래 값은 모두 실물 시험 전 시작값이다 (runbook에서 채운다).
gripper: parallel
gripper_width_mm: [[0, 0], [100, 84]]   # [서보 값, 벌림 폭 mm]. 실물 몫: 카드·캘리퍼로 잰 표로 바꾼다
grasp_max_open_mm: 84
grasp_tilt_deg: 0
grasp_min_contact_mm: 8                 # 실물 몫
gripper_tip_offset_mm: 10               # TCP(두 턱 중앙) -> 손끝, 도구 축 방향. URDF의 TCP는 손끝보다 10mm 위. 실물에서 확인
contact_lag_units: 4.0                  # 실물 몫: 접촉 감지 지연 기준
gripper_squeeze_torque: 300             # 실물 몫
gripper_hold_torque: 200                # 실물 몫
gripper_load_warn_pct: 60               # 실물 몫
urdf: assets/so101_parallel.urdf    # 관절 이름 gripper, 서보 ID 6 그대로 (REQ-041)
grasp_approach: vertical                # vertical(수직) | auto(6.6.1, 결정 0069). M5에서 auto가 vertical 이상이면 기본을 바꾼다
grasp_approach_tilts_deg: [0, 20, 35, 50]
grasp_contact_tilt_max_deg: 20          # 시작값(실측 근거 없음). 58mm 상자의 높이 규칙과 같은 값
grasp_approach_tilt_pref_deg: 35
