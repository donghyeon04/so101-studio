[project]
name = "so101-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml", "ruckig", "pyserial", "scipy", "trimesh"]

[project.optional-dependencies]
gui = ["viser[urdf]", "nicegui", "psutil"]  # psutil: 켤 때 GUI 포트를 잡은 이전 GUI 찾기(gui/port_check.py)
# 화면 시험(tests/gui_visual, 결정 0054). 설치 뒤 한 번: python -m playwright install chromium
test = ["pytest", "pytest-playwright", "pytest-playwright-visual-snapshot"]
mujoco = ["mujoco>=4.0,<5"]  # 물리 시뮬레이션 (결정 0053, arm-software-spec 13). numpy가 conda 2.2.6에서 바뀌면 `pip install --no-deps` 로 설치한다(13.8)

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 화면 시험 기준 사진과 실패 사진(레포 루트에서 pytest를 돌린다)
playwright_visual_snapshots_path = "tests/gui_visual/__snapshots__"
playwright_visual_snapshot_failures_path = "runs/snapshot_failures"
markers = ["slow: 10초 넘게 걸리는 시험 (-m \"not slow\"로 건너뛴다, 결정 0046)"]

[tool.setuptools.packages.find]
where = ["src"]
