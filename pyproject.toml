[project]
name = "so101-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml", "ruckig", "pyserial", "scipy", "trimesh"]

[project.optional-dependencies]
gui = ["viser[urdf]", "nicegui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: 10초 넘게 걸리는 시험 (-m \"not slow\"로 건너뛴다, 결정 0046)"]

[tool.setuptools.packages.find]
where = ["src"]
