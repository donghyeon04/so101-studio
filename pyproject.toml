[project]
name = "so101-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml", "ruckig", "pyserial"]

[project.optional-dependencies]
gui = ["viser[urdf]", "nicegui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
